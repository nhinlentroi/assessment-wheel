<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Wheel of Categories</title><style>body{font-family:Arial,sans-serif;text-align:center;background:#f5f5f5;margin:20px}canvas{border-radius:50%}button{padding:12px 24px;margin:10px;border:none;border-radius:6px;cursor:pointer;font-size:16px}#spinBtn{background:#0078d4;color:#fff}#resetBtn{background:#28a745;color:#fff}#result{font-size:24px;font-weight:bold;margin:15px 0;min-height:30px}</style></head><body><h1>Wheel of Categories</h1><div><button id="spinBtn">🎯 Spin</button><button id="resetBtn">🔄 Reset Wheel</button></div><div id="result">Click Spin!</div><canvas id="wheel" width="700" height="700"></canvas><script>const originalEntries=["PET_FOOD","NUTRITIONAL_SUPPLEMENT","SHIRT","HEALTH_PERSONAL_CARE","PANTS","CELLULAR_PHONE_CASE","SKIN_MOISTURIZER","COFFEE","SHOES","SKIN_CLEANING_AGENT","TOYS_AND_GAMES","HEADPHONES","PET_SUPPLIES","VITAMIN","SOCKS","CLEANING_AGENT","HERBAL_SUPPLEMENT","BEAUTY","WRITING_INSTRUMENT","WALL_ART","DRESS","PET_TOY","HOME","TEA","PHYSICAL_MOVIE"];let entries=[...originalEntries];const canvas=document.getElementById('wheel');const ctx=canvas.getContext('2d');const result=document.getElementById('result');const cx=350,cy=350,radius=300;const colors=[...Array(30)].map((_,i)=>`hsl(${i*12},70%,55%)`);let angle=0,spinning=false;function drawWheel(){ctx.clearRect(0,0,700,700);if(!entries.length){ctx.font='28px Arial';ctx.textAlign='center';ctx.fillText('Wheel Empty',cx,cy);return;}const arc=2*Math.PI/entries.length;entries.forEach((entry,i)=>{const start=i*arc-Math.PI/2+angle;const end=start+arc;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,radius,start,end);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.save();ctx.translate(cx,cy);ctx.rotate(start+arc/2);ctx.fillStyle='white';ctx.font='12px Arial';ctx.textAlign='right';ctx.fillText(entry,radius-12,4);ctx.restore();});ctx.beginPath();ctx.arc(cx,cy,40,0,2*Math.PI);ctx.fillStyle='#fff';ctx.fill();ctx.stroke();ctx.fillStyle='red';ctx.beginPath();ctx.moveTo(cx,25);ctx.lineTo(cx-18,65);ctx.lineTo(cx+18,65);ctx.closePath();ctx.fill();}drawWheel();document.getElementById('spinBtn').addEventListener('click',()=>{if(spinning)return;if(!entries.length){result.textContent='No entries left. Reset the wheel.';return;}spinning=true;const extra=Math.random()*360+1080;const startAngle=angle;const endAngle=angle+extra*Math.PI/180;const duration=1500;const startTime=performance.now();function animate(t){let p=Math.min((t-startTime)/duration,1);let eased=1-Math.pow(1-p,3);angle=startAngle+(endAngle-startAngle)*eased;drawWheel();if(p<1){requestAnimationFrame(animate);}else{const arc=2*Math.PI/entries.length;const pointerAngle=((3*Math.PI/2-(angle%(2*Math.PI)))+2*Math.PI)%(2*Math.PI);const winnerIndex=Math.floor(pointerAngle/arc)%entries.length;const winner=entries[winnerIndex];result.textContent='Selected: '+winner;entries.splice(winnerIndex,1);drawWheel();spinning=false;}}requestAnimationFrame(animate);});document.getElementById('resetBtn').addEventListener('click',()=>{entries=[...originalEntries];angle=0;spinning=false;result.textContent='';drawWheel();});</script></body></html>
